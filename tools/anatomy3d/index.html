<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#040914" />
  <title>FTR Akademi - 3D Anatomi</title>
  <script src="./android-asset-fetch.js"></script>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/layout-lock.css" />
</head>
<body>
  <main id="anatomy-app" class="anatomy-app" data-system="muscle">
    <header class="topbar">
      <button id="backBtn" class="icon-btn" type="button" aria-label="Geri">←</button>
      <div class="topbar-title">
        <h1>3D ANATOMİ</h1>
        <p id="systemSubtitle">KAS SİSTEMİ</p>
      </div>
      <button id="focusModeBtn" class="icon-btn" type="button" aria-label="Tam ekran">⛶</button>
    </header>

    <nav class="system-tabs" aria-label="Anatomi sistemleri">
      <button class="system-btn active" data-system="muscle" type="button"><span class="tab-symbol">◒</span><span>Kaslar</span></button>
      <button class="system-btn" data-system="bone" type="button"><span class="tab-symbol">◇</span><span>Kemikler</span></button>
      <button class="system-btn" data-system="ligament" type="button"><span class="tab-symbol">✦</span><span>Ligamentler</span></button>
      <button class="system-btn" data-system="vessel" type="button"><span class="tab-symbol">◉</span><span>Damarlar</span></button>
      <button class="system-btn" data-system="nerve" type="button"><span class="tab-symbol">☀</span><span>Sinirler</span></button>
    </nav>

    <section class="stage-shell">
      <aside class="structure-browser panel" aria-label="Anatomik yapı listesi">
        <h2 id="browserHeading">KAS SİSTEMİ</h2>
        <label class="search-box">
          <span class="sr-only">Yapı ara</span>
          <input id="structureSearch" type="search" autocomplete="off" placeholder="Kas ara..." />
          <span aria-hidden="true">⌕</span>
        </label>
        <div id="browserSectionTitle" class="browser-section-title">YAPILAR</div>
        <div id="structureList" class="structure-list" role="listbox" aria-label="Anatomik yapılar"></div>
        <div class="browser-note"><span>◌</span><span>Bir yapıya dokununca model üzerinde vurgulanır.</span></div>
      </aside>

      <section class="model-column">
        <div id="viewer" class="viewer" aria-label="Katmanlı 3D görünümlü anatomi atlası">
          <canvas id="anatomyCanvas" width="720" height="1120"></canvas>
          <div id="loading" class="loading-card"><div class="spinner"></div><span>Anatomi atlası yükleniyor…</span></div>
          <div id="modelLabel" class="model-label hidden"><span id="modelLabelText"></span></div>
          <div class="selection-hint">Yapı seç → modelde vurgula • İki parmakla yakınlaştır</div>
        </div>
      </section>
    </section>

    <section id="infoCard" class="info-card panel" aria-live="polite">
      <div id="previewVisual" class="info-preview" aria-hidden="true"><span id="previewIcon">◒</span></div>
      <div class="info-main">
        <div class="info-head">
          <div>
            <h3 id="structureName">Biceps brachii</h3>
            <p id="structureSubtitle">İki başlı kol kası</p>
          </div>
          <span id="structureSystem" class="structure-system">KAS</span>
        </div>
        <div id="tabs" class="tabs" role="tablist" aria-label="Anatomik bilgi başlıkları"></div>
        <p id="structureText" class="structure-text">Atlas hazırlanıyor…</p>
        <div id="factGrid" class="fact-grid"></div>
      </div>
      <div class="license-line">Anatomi kaynağı: Z-Anatomy / BodyParts3D • CC BY-SA 4.0</div>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/qa-layout.js"></script>
</body>
</html>
