<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#040914" />
  <title>FTR Akademi - 3D Anatomi</title>
  <script src="./android-asset-fetch.js"></script>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main id="anatomy-app" class="anatomy-app">
    <header class="topbar">
      <button id="backBtn" class="icon-btn back-btn" type="button" aria-label="Geri">←</button>
      <div class="topbar-title">
        <h1>3D ANATOMİ</h1>
        <p id="systemSubtitle">KAS SİSTEMİ</p>
      </div>
      <button id="focusModeBtn" class="icon-btn focus-btn" type="button" aria-label="Odak görünümü">⛶</button>
    </header>

    <nav class="system-tabs" aria-label="Anatomi sistemleri">
      <button class="system-btn active" data-system="muscle" type="button"><span class="tab-symbol">◒</span><span>Kaslar</span></button>
      <button class="system-btn" data-system="bone" type="button"><span class="tab-symbol">◇</span><span>Kemikler</span></button>
      <button class="system-btn" data-system="ligament" type="button"><span class="tab-symbol">✦</span><span>Ligamentler</span></button>
      <button class="system-btn" data-system="vessel" type="button"><span class="tab-symbol">◉</span><span>Damarlar</span></button>
      <button class="system-btn" data-system="nerve" type="button"><span class="tab-symbol">☀</span><span>Sinirler</span></button>
    </nav>

    <section class="stage-shell">
      <aside class="structure-browser panel" aria-label="Anatomik yapı listesi">
        <h2 id="browserHeading">KAS SİSTEMİ</h2>
        <label class="search-box">
          <span class="sr-only">Yapı ara</span>
          <input id="structureSearch" type="search" autocomplete="off" placeholder="Kas ara..." />
          <span aria-hidden="true">⌕</span>
        </label>
        <div class="browser-section-title" id="browserSectionTitle">YAPILAR</div>
        <div id="structureList" class="structure-list" role="listbox" aria-label="Anatomik yapılar"></div>
        <div class="browser-actions">
          <button id="layersBtn" type="button"><span>▱</span><span>Katmanlar</span></button>
          <button id="transparencyBtn" type="button"><span>◌</span><span>Şeffaflık</span></button>
        </div>
      </aside>

      <section class="model-column">
        <div id="viewer" class="viewer" aria-label="Etkileşimli 3D anatomi modeli">
          <canvas id="anatomyCanvas"></canvas>
          <div id="loading" class="loading-card"><div class="spinner"></div><span>3D anatomi yükleniyor…</span></div>
          <div id="modelLabel" class="model-label hidden"><span id="modelLabelText"></span></div>
          <div class="selection-hint">Yapıya dokun → bilgisini incele</div>
        </div>
      </section>

      <aside class="viewer-controls panel" aria-label="Model kontrolleri">
        <button id="rotateBtn" type="button"><span class="control-label">Döndür</span><b>↻</b></button>
        <button id="zoomInBtn" type="button"><span class="control-label">Yakınlaştır</span><b>＋</b></button>
        <button id="zoomOutBtn" type="button"><span class="control-label">Uzaklaştır</span><b>−</b></button>
        <button id="resetBtn" type="button"><span class="control-label">Sıfırla</span><b>⌾</b></button>
        <div class="control-separator"></div>
        <button id="autoRotateBtn" type="button" aria-pressed="false"><span class="control-label">Otomatik<br>Döndür</span><b>▷</b></button>
      </aside>
    </section>

    <section id="infoCard" class="info-card panel" aria-live="polite">
      <div class="info-preview" aria-hidden="true">
        <div id="previewIcon" class="preview-icon">◒</div>
        <div id="previewCaption" class="preview-caption">SEÇİLİ YAPI</div>
      </div>
      <div class="info-main">
        <div class="info-head">
          <div>
            <h3 id="structureName">Biceps brachii</h3>
            <p id="structureSubtitle">İki başlı kol kası</p>
          </div>
          <span id="structureSystem" class="structure-system">KAS</span>
        </div>
        <div id="tabs" class="tabs" role="tablist" aria-label="Anatomik bilgi başlıkları"></div>
        <p id="structureText" class="structure-text">Model hazırlanıyor…</p>
        <div id="factGrid" class="fact-grid"></div>
      </div>
      <div class="license-line">3D model: Z-Anatomy / BodyParts3D • CC BY-SA 4.0</div>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/qa-layout.js"></script>
</body>
</html>
