name: Bootstrap Android Mini SDK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-android-mini-sdk.yml'

permissions:
  contents: read

jobs:
  package-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Package minimal Android SDK
        run: |
          mkdir -p mini-sdk/platforms/android-36 mini-sdk/build-tools
          cp "$ANDROID_HOME/platforms/android-36/android.jar" mini-sdk/platforms/android-36/
          cp -a "$ANDROID_HOME/build-tools/36.0.0" mini-sdk/build-tools/
          tar -czf android-mini-sdk.tar.gz mini-sdk
          ls -lh android-mini-sdk.tar.gz

      - name: Upload mini SDK
        uses: actions/upload-artifact@v4
        with:
          name: android-mini-sdk
          path: android-mini-sdk.tar.gz
          if-no-files-found: error
          retention-days: 2
