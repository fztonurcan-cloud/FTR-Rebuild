name: v30 plan1 ligament artifact fail-closed guards

on:
  push:
    branches: [v30-three-plan-premium]
    paths:
      - '.github/workflows/v30-plan1-artifact-guards.yml'
      - 'tools/v30/derive_plan1_ligament_from_v299.py'
  pull_request:
    branches: [v30-three-plan-premium]
    paths:
      - '.github/workflows/v30-plan1-artifact-guards.yml'
      - 'tools/v30/derive_plan1_ligament_from_v299.py'

permissions:
  contents: read
  actions: read

jobs:
  derive-and-verify-plan1:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASELINE_ARTIFACT_ID: '9872460705'
      BASELINE_ARTIFACT_DIGEST: 'sha256:48e48fdd5c22428dc73ed7a9df758d60f85b79ca1d15bd2f20539122a4abb235'
      BASELINE_ARTIFACT_SIZE: '4502184'
      BASELINE_HEAD_SHA: 'cfdf34fd0d1fa8bfb1ce6e9f4a755c9e4773b0fd'
      EXPECTED_LIGAMENT_ID_SHA256: '171d2bd119d3e08530d5c6bad77c6a5b6cf66283fdf5455f01a9cb61fcc75eb7'

    steps:
      - name: Checkout v30 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Verify baseline artifact provenance and download exact v29.9 atlas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}")"
          python3 - "$meta" <<'PY'
          import json, os, sys
          m=json.loads(sys.argv[1])
          assert m['id'] == int(os.environ['BASELINE_ARTIFACT_ID'])
          assert m['workflow_run']['head_sha'] == os.environ['BASELINE_HEAD_SHA']
          assert m['digest'] == os.environ['BASELINE_ARTIFACT_DIGEST']
          assert m['size_in_bytes'] == int(os.environ['BASELINE_ARTIFACT_SIZE'])
          assert not m['expired']
          print('BASELINE ARTIFACT PROVENANCE PASS')
          PY

          mkdir -p /tmp/ftr/base
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o /tmp/ftr/base.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip"
          unzip -q /tmp/ftr/base.zip -d /tmp/ftr/base
          test -f /tmp/ftr/base/dist/atlas/ligament-id.png
          test -f /tmp/ftr/base/dist/atlas/ligament-front.png
          test -f /tmp/ftr/base/dist/data/atlas-map.json
          test "$(sha256sum /tmp/ftr/base/dist/atlas/ligament-id.png | awk '{print $1}')" = "$EXPECTED_LIGAMENT_ID_SHA256"
          echo 'VERIFIED V29.9 BASELINE DOWNLOAD PASS'

      - name: Derive red ligament beauty layer from exact baseline without rendering ID map
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ftr/derived
          python tools/v30/derive_plan1_ligament_from_v299.py \
            --baseline /tmp/ftr/base \
            --output /tmp/ftr/derived \
            --report /tmp/ftr/plan1-derived-report.json
          test -f /tmp/ftr/plan1-derived-report.json
          echo 'PLAN1 BASELINE-DERIVED ARTIFACT CREATED'

      - name: Invisible ligament ID map must remain byte-identical
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(sha256sum /tmp/ftr/base/dist/atlas/ligament-id.png | awk '{print $1}')"
          derived_sha="$(sha256sum /tmp/ftr/derived/dist/atlas/ligament-id.png | awk '{print $1}')"
          echo "BASELINE_LIGAMENT_ID_SHA256=${base_sha}"
          echo "DERIVED_LIGAMENT_ID_SHA256=${derived_sha}"
          test "$base_sha" = "$EXPECTED_LIGAMENT_ID_SHA256"
          test "$derived_sha" = "$EXPECTED_LIGAMENT_ID_SHA256"
          cmp -s /tmp/ftr/base/dist/atlas/ligament-id.png /tmp/ftr/derived/dist/atlas/ligament-id.png
          echo 'LIGAMENT ID MAP BYTE-IDENTICAL PASS'

      - name: Beauty layer changes while all unrelated baseline artifact files remain identical
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          base=Path('/tmp/ftr/base')
          derived=Path('/tmp/ftr/derived')
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def tree(root):
              return {p.relative_to(root).as_posix():h(p) for p in sorted(root.rglob('*')) if p.is_file()}
          b=tree(base); d=tree(derived)
          changed=sorted(k for k in b if d.get(k)!=b[k])
          added=sorted(k for k in d if k not in b)
          removed=sorted(k for k in b if k not in d)
          assert changed == ['dist/atlas/ligament-front.png','dist/data/atlas-map.json'], changed
          assert not added, added
          assert not removed, removed
          assert h(base/'dist/atlas/ligament-front.png') != h(derived/'dist/atlas/ligament-front.png')
          report=json.loads(Path('/tmp/ftr/plan1-derived-report.json').read_text(encoding='utf-8'))
          assert report['status']=='PLAN1_DERIVED_ARTIFACT_QA_PASS'
          assert report['ligament_id_byte_identical'] is True
          assert report['ligament_structure_contract_unchanged'] is True
          assert report['structure_count']==292
          assert report['recolored_ligament_pixels'] > 100
          print('PLAN1 DERIVED SCOPE + BEAUTY CHANGE PASS', report['recolored_ligament_pixels'])
          PY

      - name: Static runtime and Plan 1 policy contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/ftr/derived/dist/data/atlas-map.json').read_text(encoding='utf-8'))
          assert data.get('render_mode')=='static-layered-atlas'
          p=data.get('policy') or {}
          assert p.get('webgl') is False
          assert p.get('runtime_3d_models') is False
          assert p.get('continuous_render_loop') is False
          assert p.get('ligament_high_visibility_red') is True
          assert p.get('ligament_skeleton_reference_preserved') is True
          assert p.get('ligament_id_map_unchanged_by_recolor') is True
          assert p.get('plan1_derived_from_physically_verified_v29_9') is True
          print('PLAN1 STATIC RUNTIME + POLICY PASS')
          PY

      - name: Upload verified Plan 1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v30-plan1-derived-from-v29.9
          path: |
            /tmp/ftr/derived
            /tmp/ftr/plan1-derived-report.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
