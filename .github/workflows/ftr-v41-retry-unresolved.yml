name: FTR v41 Retry Unresolved Images
on:
  push:
    branches: [ftr-v41-offline-localization]
    paths:
      - '.github/workflows/ftr-v41-retry-unresolved.yml'
      - 'tools/v41-fetch/retry_unresolved.py'
      - 'tools/v41-fetch/unresolved66.b64'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/v41-fetch/retry_unresolved.py
      - if: always()
        run: cat /tmp/ftr-v41-retry/summary.json || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftr-v41-retry-unresolved
          path: /tmp/ftr-v41-retry/
          retention-days: 1
          if-no-files-found: error
