name: v30 host integration fail-closed guards

on:
  push:
    branches: [v30-three-plan-premium]
  pull_request:
    branches: [v30-three-plan-premium]

permissions:
  contents: read

jobs:
  host-integration-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host bridge inputs must exist
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/v30/integration/v30-three-plan.js
          test -f tools/v30/integration/v30-three-plan.css
          test -f tools/v30/build_v30_three_plan_apk.py
          test -f tools/v30/verify_v30_release_inputs.py
          test -f tools/clinical-scales/premium-reference.css
          test -f tools/clinical-scales/premium-reference.js
          echo 'V30 PREMIUM HOST INPUTS PRESENT'

      - name: Host and clinical syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/v30/integration/v30-three-plan.js
          node --check tools/clinical-scales/app.js
          node --check tools/clinical-scales/premium-reference.js
          python3 -m py_compile tools/v30/verify_v30_release_inputs.py
          echo 'V30 PREMIUM HOST + CLINICAL SYNTAX PASS'

      - name: Approved premium home and drawer contract
        shell: bash
        run: |
          set -euo pipefail
          js='tools/v30/integration/v30-three-plan.js'
          css='tools/v30/integration/v30-three-plan.css'
          grep -Fq "const PREMIUM_ID = 'ftr-v30-premium-home'" "$js"
          grep -Fq "const DRAWER_ID = 'ftr-v30-premium-drawer'" "$js"
          grep -Fq 'Merhaba, Fizyoterapist!' "$js"
          grep -Fq '>Derslerim<' "$js"
          grep -Fq '>3D Anatomi<' "$js"
          grep -Fq '>Hareket Stüdyosu<' "$js"
          grep -Fq 'Klinik Ölçekler <mark>YENİ</mark>' "$js"
          grep -Fq 'Kısayollarım' "$js"
          grep -Fq 'Çalışma Alanım' "$js"
          grep -Fq 'Fizyoterapi Bilgi Platformu' "$js"
          grep -Fq './anatomy3d/atlas/muscle-front.png' "$js"
          grep -Fq './brand/ftr-logo-exact.png' "$js"
          grep -Fq '.ftr-v30-premium-topbar' "$css"
          grep -Fq '.ftr-v30-premium-hero' "$css"
          grep -Fq '.ftr-v30-module-stack' "$css"
          grep -Fq '.ftr-v30-shortcuts' "$css"
          grep -Fq '.ftr-v30-bottom-nav' "$css"
          grep -Fq '.ftr-v30-drawer' "$css"
          grep -Fq 'Visual target: ChatGPT Image 3 Eyl 2026 13_01_16.png' "$css"
          echo 'APPROVED PREMIUM HOME + DRAWER CONTRACT PASS'

      - name: Premium navigation bridge contract
        shell: bash
        run: |
          set -euo pipefail
          js='tools/v30/integration/v30-three-plan.js'
          grep -Fq "window.location.href = './anatomy3d/index.html'" "$js"
          grep -Fq "window.location.href = './clinical-scales/index.html'" "$js"
          grep -Fq ".v56-hot-allclasses" "$js"
          grep -Fq ".v56-hot-movement" "$js"
          grep -Fq ".v56-hot-nav-search" "$js"
          grep -Fq ".v56-hot-nav-profile" "$js"
          grep -Fq 'legacyTextClick' "$js"
          grep -Fq "url.searchParams.get('v30nav')" "$js"
          grep -Fq 'consumeExternalRoute' "$js"
          echo 'PREMIUM HOST NAVIGATION BRIDGE PASS'

      - name: Clinical Scales premium reference contract
        shell: bash
        run: |
          set -euo pipefail
          html='tools/clinical-scales/index.html'
          css='tools/clinical-scales/premium-reference.css'
          js='tools/clinical-scales/premium-reference.js'
          grep -Fq './premium-reference.css' "$html"
          grep -Fq './premium-reference.js' "$html"
          grep -Fq 'id="filterBtn"' "$html"
          grep -Fq 'class="clinical-bottom-nav"' "$html"
          grep -Fq 'Ölçek ara…' "$html"
          grep -Fq '.category-card:nth-child(8)' "$css"
          grep -Fq '.clinical-bottom-nav' "$css"
          grep -Fq "window.location.href = '../index.html'" "$js"
          grep -Fq '../index.html?v30nav=' "$js"
          grep -Fq 'filters-open' "$js"
          echo 'CLINICAL PREMIUM REFERENCE CONTRACT PASS'

      - name: Exact brand home-control contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq './brand/ftr-logo-exact.png' tools/v30/integration/v30-three-plan.js
          grep -Fq '../brand/ftr-logo-exact.png' tools/clinical-scales/index.html
          grep -Fq '../brand/ftr-logo-exact.png' tools/anatomy3d/index.html
          grep -Fq 'ftr-logo-exact.sha256' tools/v30/build_v30_three_plan_apk.py
          if test -f tools/brand/ftr-logo-exact.png; then
            test -f tools/brand/ftr-logo-exact.sha256
            expected="$(tr -d '\r\n ' < tools/brand/ftr-logo-exact.sha256)"
            actual="$(sha256sum tools/brand/ftr-logo-exact.png | awk '{print $1}')"
            test "$actual" = "$expected"
            echo 'EXACT BRAND HASH PASS'
          else
            test ! -f tools/brand/ftr-logo-exact.sha256
            echo 'EXACT BRAND PENDING: RELEASE BUILD REMAINS BLOCKED'
          fi

      - name: Clinical release payload completeness
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            index.html style.css evidence-enhancer.css premium-reference.css data.js evidence-overrides.js \
            turkish-evidence.js scoring-evidence.js app.js premium-reference.js visual-enhancer.js \
            detail-evidence-enhancer.js RESEARCH-MANIFEST.md; do
            test -f "tools/clinical-scales/$f"
          done
          grep -Fq './scoring-evidence.js' tools/clinical-scales/index.html
          grep -Fq './detail-evidence-enhancer.js' tools/clinical-scales/index.html
          grep -Fq './evidence-enhancer.css' tools/clinical-scales/index.html
          echo 'CLINICAL RELEASE PAYLOAD PASS'

      - name: Interactive clinical scoring contracts
        shell: bash
        run: |
          set -euo pipefail
          app='tools/clinical-scales/app.js'
          grep -Fq "const BERG = [" "$app"
          grep -Fq "const DGI = [" "$app"
          grep -Fq "const TINETTI = [" "$app"
          grep -Fq "{label:'Adım uzunluğu ve yüksekliği — sağ/sol dört gözlem toplamı', max:4, section:'Yürüyüş'}" "$app"
          grep -Fq "tinettiBalance !== 16 || tinettiGait !== 12 || tinettiTotal !== 28" "$app"
          grep -Fq "BERG.length !== 14 || BERG.length * 4 !== 56" "$app"
          grep -Fq "DGI.length !== 8 || DGI.length * 3 !== 24" "$app"
          grep -Fq "const expectedMax = {berg:56, tinetti:28, dgi:24}" "$app"
          grep -Fq 'Denge: ${balance} / 16' "$app"
          grep -Fq 'Yürüyüş: ${gait} / 12' "$app"
          grep -Fq "Standart fiziksel kit gereklidir" "$app"
          grep -Fq "Tek bir evrensel düşme-risk eşiği yoktur" "$app"
          echo 'CLINICAL INTERACTIVE SCORE CONTRACTS PASS'

      - name: Release preflight fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          gate='tools/v30/verify_v30_release_inputs.py'
          grep -Fq 'acbe8ba68cad016d56f4d61e43cfa912e37c65543e5321162d03f69dc220b809' "$gate"
          grep -Fq '9891447400' "$gate"
          grep -Fq 'f6d50400ddbdd31805a82c5b020040ca3c5fcc864fe83be32fa65c81f6ad2028' "$gate"
          grep -Fq '171d2bd119d3e08530d5c6bad77c6a5b6cf66283fdf5455f01a9cb61fcc75eb7' "$gate"
          grep -Fq 'plan1_derived_from_physically_verified_v29_9' "$gate"
          grep -Fq 'BRAND_EXPECTED_DIMS = (112, 112)' "$gate"
          grep -Fq 'exact Plan 3 brand PNG/SHA lock is still missing' "$gate"
          echo 'V30 RELEASE PREFLIGHT CONTRACT PASS'

      - name: Offline and scope safety
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'XMLHttpRequest|WebSocket|navigator\.geolocation|navigator\.mediaDevices' tools/v30/integration tools/clinical-scales/*.js
          ! grep -R -n -E '\bfetch\s*\(' tools/v30/integration tools/clinical-scales/*.js
          ! grep -R -n -E 'patientName|hastaAdi|hasta_ad[iı]|tcKimlik|TCKN|emailAddress' tools/v30/integration tools/clinical-scales || true
          echo 'V30 PREMIUM HOST + CLINICAL OFFLINE SCOPE PASS'
