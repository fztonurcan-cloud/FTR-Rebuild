name: v30 temporary release source export

on:
  push:
    branches: [v30-three-plan-premium]
    paths: ['.github/workflows/v30-source-export-temp.yml']

permissions:
  contents: write

env:
  TARGET_BRANCH: v30-three-plan-premium

jobs:
  export-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record exact source commit
        run: |
          git rev-parse HEAD | tee V30-SOURCE-COMMIT.txt
          test -f tools/v30/verify_v30_release_inputs.py
          test -f tools/v30/build_v30_three_plan_apk.py
          test -f tools/v30/apply_v30_plan3_visual_parity.py
          test -f tools/brand/ftr-logo-exact.png
          test -f tools/brand/ftr-logo-exact.sha256

      - name: Upload exact release source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: v30-release-source-snapshot
          if-no-files-found: error
          compression-level: 6
          path: |
            V30-SOURCE-COMMIT.txt
            THREE-PLAN-SCOPE-LOCK.md
            tools/brand
            tools/clinical-scales
            tools/v30

      - name: Remove temporary export workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v30-source-export-temp.yml
          git commit -m 'Remove temporary v30 source export workflow'
          git push origin HEAD:${TARGET_BRANCH}
