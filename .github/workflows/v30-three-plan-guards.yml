name: v30 three-plan fail-closed guards

on:
  push:
    branches: [v30-three-plan-premium]
  pull_request:
    branches: [v30-three-plan-premium]

permissions:
  contents: read

jobs:
  three-plan-source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout v30 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce exact three-plan scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='6abf0aab2c2ede44b9ef9ffd35af878160a85ba1'
          git cat-file -e "${BASE}^{commit}"
          bad=0
          while IFS= read -r path; do
            case "$path" in
              THREE-PLAN-SCOPE-LOCK.md|.github/workflows/v30-three-plan-guards.yml|.github/workflows/v30-host-integration-guards.yml|.github/workflows/v30-plan1-artifact-guards.yml|tools/clinical-scales/*|tools/brand/*|tools/anatomy3d/index.html|tools/anatomy3d/src/brand-nav.css|tools/anatomy3d/src/brand-nav.js|tools/v30/*) ;;
              *) echo "FORBIDDEN OUT-OF-SCOPE CHANGE: $path"; bad=1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          test "$bad" -eq 0
          echo 'THREE-PLAN SCOPE PASS'

      - name: Source syntax QA
        shell: bash
        run: |
          set -euo pipefail
          for js in \
            tools/clinical-scales/data.js \
            tools/clinical-scales/evidence-overrides.js \
            tools/clinical-scales/turkish-evidence.js \
            tools/clinical-scales/scoring-evidence.js \
            tools/clinical-scales/app.js \
            tools/clinical-scales/visual-enhancer.js \
            tools/clinical-scales/detail-evidence-enhancer.js \
            tools/anatomy3d/src/brand-nav.js; do
            node --check "$js"
          done
          python3 -m py_compile tools/anatomy3d/scripts/postprocess_reference_groups.py tools/v30/build_v30_three_plan_apk.py tools/v30/derive_plan1_ligament_from_v299.py
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/brand/extract_exact_logo_from_reference.ps1", [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          echo 'SOURCE SYNTAX PASS'

      - name: Validate clinical catalogue evidence rights and scoring
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = {window:{}};
          vm.createContext(context);
          for (const file of [
            'tools/clinical-scales/data.js',
            'tools/clinical-scales/evidence-overrides.js',
            'tools/clinical-scales/turkish-evidence.js',
            'tools/clinical-scales/scoring-evidence.js'
          ]) vm.runInContext(fs.readFileSync(file,'utf8'), context, {filename:file});
          const db = context.window.FTR_CLINICAL_SCALES;
          if (!db) throw new Error('database missing');
          if (db.categories.length !== 8 || db.scales.length !== 29) throw new Error('8-category/29-instrument lock failed');
          if (db.evidenceVersion !== '2026-09-03-authoritative-pass-2') throw new Error('authoritative evidence pass missing');
          if (db.turkishEvidenceVersion !== '2026-09-03-pubmed-pass-3') throw new Error('Turkey evidence pass missing');
          if (db.scoringEvidenceVersion !== '2026-09-03-deep-scoring-pass-1') throw new Error('deep scoring pass missing');
          if (!db.evidencePolicy?.populationSpecificCutoffs || !db.evidencePolicy?.exactEditionLabels || !db.evidencePolicy?.proprietaryFormsNotEmbeddedWithoutPermission) throw new Error('evidence policy incomplete');
          if (!db.turkishEvidencePolicy?.psychometricValidationDoesNotGrantCopyright || !db.turkishEvidencePolicy?.turkeyCohortEvidenceSeparatedFromTranslationLicense || !db.turkishEvidencePolicy?.languageValidationSeparatedFromPopulationReferenceValues || !db.turkishEvidencePolicy?.indirectComparatorEvidenceExplicitlyLabeled) throw new Error('Turkey evidence rights/reference separation missing');
          if (!db.scoringEvidencePolicy?.protectedItemWordingExcluded || !db.scoringEvidencePolicy?.classificationVersusOutcomeSeparated) throw new Error('deep scoring policy incomplete');
          const ids = new Set(db.scales.map(x=>x.id));
          const required = ['barthel','fim','katz','lawton','brunnstrom','fma','nihss','rivermead','mas','tardieu','penn','berg','tug','tinetti','dgi','odi','ndi','dash','womac','hhs','gmfm','gmfcs','pdms','jebsen','9hpt','purdue','sf36','mmse','6mwt'];
          for (const id of required) if (!ids.has(id)) throw new Error(`missing ${id}`);
          const openInteractive = new Set(['mas','tardieu','penn','berg','tug','tinetti','dgi','9hpt','6mwt']);
          for (const s of db.scales) {
            if (!s.name || !s.population || !s.format || !s.interpretation || !s.rights || !Array.isArray(s.sources) || !s.sources.length) throw new Error(`${s.id}: core metadata incomplete`);
            if (s.rights.mode !== 'open' && s.interactive !== null) throw new Error(`${s.id}: protected form exposed interactively`);
            if (s.interactive && !openInteractive.has(s.id)) throw new Error(`${s.id}: unexpected interactive tool`);
          }
          const x = Object.fromEntries(db.scales.map(s=>[s.id,s]));
          const bergContext = /popülasyon/i.test(x.berg.interpretation) && /(tek eşik|evrensel)/i.test(x.berg.interpretation);
          const tugContext = /≥12 sn/.test(x.tug.interpretation) && /evrensel değildir/i.test(x.tug.interpretation);
          if (!bergContext || !tugContext) throw new Error('Berg/TUG population context missing');
          if (!/V1/.test(x.tardieu.format) || !/R1/.test(x.tardieu.format) || !/R2/.test(x.tardieu.format)) throw new Error('Tardieu velocity/R1/R2 missing');
          if (!/0–4/.test(x.penn.format) || !/1–3/.test(x.penn.format)) throw new Error('Penn two-part scoring missing');
          if (!/PDMS-3/.test(x.pdms.format) || !/Pearson/.test(x.pdms.interpretation) || x.pdms.rights.mode !== 'restricted') throw new Error('PDMS-3 lock missing');
          if (!/Modified Dynamic Gait Index|mDGI/.test(x.dgi.turkish)) throw new Error('DGI/mDGI distinction missing');
          const gmfcsText = [...x.gmfcs.scoringArchitecture, x.gmfcs.interpretation].join(' ');
          if (x.gmfcs.id !== 'gmfcs' || !/beş seviyeli/i.test(gmfcsText) || !/sınıflandırma/i.test(gmfcsText) || !/test toplam puanı değildir/i.test(gmfcsText)) throw new Error('GMFCS classification lock missing');
          if (!x.gmfm.scoringArchitecture.some(v=>/GMAE/.test(v))) throw new Error('GMFM-66 GMAE lock missing');
          if (!x.womac.scoringArchitecture.some(v=>/5/.test(v)&&/2/.test(v)&&/17/.test(v))) throw new Error('WOMAC 5+2+17 lock missing');
          if (!x.hhs.scoringArchitecture.some(v=>/44/.test(v)&&/47/.test(v)&&/4/.test(v)&&/5/.test(v))) throw new Error('HHS 44+47+4+5 lock missing');
          if (!x.purdue.scoringArchitecture.some(v=>/30 sn/.test(v)&&/60 sn/.test(v))) throw new Error('Purdue timing lock missing');

          const turkeyPubmed = ['barthel','fim','katz','lawton','berg','mas','tardieu','odi','ndi','dash','womac','hhs','gmfm','gmfcs','dgi','jebsen','purdue','sf36','mmse','6mwt'];
          for (const id of turkeyPubmed) if (!Array.isArray(x[id].turkishEvidence) || !x[id].turkishEvidence.length || !x[id].sources.some(p=>/pubmed\.ncbi\.nlm\.nih\.gov/.test(p[1]))) throw new Error(`${id}: Turkey/PubMed evidence missing`);
          if (!Array.isArray(x.tinetti.turkishEvidence) || !x.tinetti.turkishEvidence.length || !x.tinetti.sources.some(p=>/10\.1007\/s11556-012-0096-2/.test(p[1]))) throw new Error('Tinetti/POMA-I Turkish validation source missing');
          if (!/65 yaş/i.test(x.tinetti.turkish) || !/28 puan/i.test(x.tinetti.turkish)) throw new Error('Tinetti/POMA-I population/version context missing');
          if (!/SF-36v2/.test(x.sf36.turkish) || !/RAND-36/.test(x.sf36.turkish)) throw new Error('SF-36/SF-36v2/RAND-36 distinction missing');
          if (!/referans veri/i.test(x['6mwt'].turkish) || !/pediatrik/i.test(x['6mwt'].turkish) || !/genellenmez/i.test(x['6mwt'].turkish)) throw new Error('6MWT Turkey reference-value context missing');
          console.log('CLINICAL EVIDENCE + RIGHTS + SCORING PASS', {categories:db.categories.length, scales:db.scales.length});
          NODE

      - name: Validate clinical UI script order visuals and deep evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html=Path('tools/clinical-scales/index.html').read_text(encoding='utf-8')
          order=['./data.js','./evidence-overrides.js','./turkish-evidence.js','./scoring-evidence.js','./app.js','./visual-enhancer.js','./detail-evidence-enhancer.js']
          pos=[html.index(x) for x in order]
          assert pos==sorted(pos), pos
          assert './evidence-enhancer.css' in html
          visuals=Path('tools/clinical-scales/visual-enhancer.js').read_text(encoding='utf-8')
          for key in ['barthel','fim','katz','lawton','brunnstrom','fma','nihss','rivermead','mas','tardieu','penn','berg','tug','tinetti','dgi','odi','ndi','dash','womac','hhs','gmfm','gmfcs','pdms','jebsen','9hpt','purdue','sf36','mmse','6mwt']:
              assert key in visuals, key
          deep=Path('tools/clinical-scales/detail-evidence-enhancer.js').read_text(encoding='utf-8')
          assert 'Skor Mimarisi' in deep and 'Türkçe Psikometrik Kanıt' in deep
          print('CLINICAL UI + 29 ORIGINAL VISUALS + DEEP EVIDENCE PASS')
          PY

      - name: Enforce offline privacy boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'fetch\(|XMLHttpRequest|WebSocket|navigator\.geolocation|navigator\.mediaDevices' tools/clinical-scales/*.js
          ! grep -R -n -E 'patientName|hastaAdi|hasta_ad[iı]|tcKimlik|TCKN|emailAddress' tools/clinical-scales || true
          grep -Fq 'Klinik karar desteği' tools/clinical-scales/index.html
          grep -Fq 'Tanı aracı değildir' tools/clinical-scales/index.html
          echo 'OFFLINE / NO-PATIENT-IDENTITY PASS'

      - name: Validate Plan 1 locked artifact and ligament contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ligament_high_visibility_red' tools/anatomy3d/scripts/postprocess_reference_groups.py
          grep -Fq 'ligament_id_map_unchanged_by_recolor' tools/anatomy3d/scripts/postprocess_reference_groups.py
          grep -Fq 'ligament_skeleton_reference_preserved' tools/anatomy3d/scripts/postprocess_reference_groups.py
          grep -Fq 'EXPECTED_BASELINE_LIGAMENT_ID_SHA256' tools/v30/derive_plan1_ligament_from_v299.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('tools/v30/PLAN1-ARTIFACT-LOCK.json').read_text(encoding='utf-8'))
          assert lock['artifact_id']==9891447400
          assert lock['artifact_digest']=='sha256:8cb6fa86d6cc5cae3a4ee1e81d57a163ca85acc3384bdf9e3a0803f89b99c76d'
          assert lock['derived_ligament_front_sha256']=='f6d50400ddbdd31805a82c5b020040ca3c5fcc864fe83be32fa65c81f6ad2028'
          assert lock['ligament_id_sha256']=='171d2bd119d3e08530d5c6bad77c6a5b6cf66283fdf5455f01a9cb61fcc75eb7'
          assert lock['ligament_id_byte_identical_to_v29_9'] is True
          assert lock['ligament_structure_count']==292
          assert lock['status']=='PLAN1_DERIVED_ARTIFACT_QA_PASS'
          print('PLAN 1 LOCKED ARTIFACT CONTRACT PASS')
          PY

      - name: Validate Plan 3 exact-brand navigation extraction and release lock
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '../brand/ftr-logo-exact.png' tools/anatomy3d/index.html
          grep -Fq '../brand/ftr-logo-exact.png' tools/clinical-scales/index.html
          grep -Fq 'anatomyHomeBrand' tools/anatomy3d/src/brand-nav.js
          grep -Fq "window.location.href = '../index.html'" tools/anatomy3d/src/brand-nav.js
          grep -Fq "location.href = '../index.html'" tools/clinical-scales/app.js
          grep -Fq 'Do **not** replace it with AI regeneration' tools/brand/EXACT-BRAND-ASSET-LOCK.md
          grep -Fq 'ftr-logo-exact.sha256' tools/brand/EXACT-BRAND-ASSET-LOCK.md
          grep -Fq '$sourceImage.Width -ne 1536' tools/brand/extract_exact_logo_from_reference.ps1
          grep -Fq '$sourceImage.Height -ne 1024' tools/brand/extract_exact_logo_from_reference.ps1
          grep -Fq '$cropX = 137' tools/brand/extract_exact_logo_from_reference.ps1
          grep -Fq '$cropY = 468' tools/brand/extract_exact_logo_from_reference.ps1
          grep -Fq '$cropW = 112' tools/brand/extract_exact_logo_from_reference.ps1
          grep -Fq '$cropH = 112' tools/brand/extract_exact_logo_from_reference.ps1
          grep -Fq '$sourceBitmap.Clone($rect' tools/brand/extract_exact_logo_from_reference.ps1
          ! grep -Fq '.DrawImage(' tools/brand/extract_exact_logo_from_reference.ps1
          ! grep -Fq '.GetThumbnailImage(' tools/brand/extract_exact_logo_from_reference.ps1
          if test -f tools/brand/ftr-logo-exact.png; then
            test -f tools/brand/ftr-logo-exact.sha256
            expected="$(tr -d '\r\n ' < tools/brand/ftr-logo-exact.sha256)"
            test "$(sha256sum tools/brand/ftr-logo-exact.png | awk '{print $1}')" = "$expected"
            echo 'EXACT BRAND BINARY + HASH PASS'
          else
            test ! -f tools/brand/ftr-logo-exact.sha256
            echo 'EXACT BRAND BINARY PENDING — RELEASE REMAINS BLOCKED'
          fi

      - name: Validate v30 builder fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'BASE_SIZE = 1_137_460_262' tools/v30/build_v30_three_plan_apk.py
          grep -Fq 'BASE_SHA256 = "acbe8ba68cad016d56f4d61e43cfa912e37c65543e5321162d03f69dc220b809"' tools/v30/build_v30_three_plan_apk.py
          grep -Fq 'EXPECTED_PLAN1_FRONT_SHA256 = "f6d50400ddbdd31805a82c5b020040ca3c5fcc864fe83be32fa65c81f6ad2028"' tools/v30/build_v30_three_plan_apk.py
          grep -Fq 'PLAN1-ARTIFACT-LOCK.json' tools/v30/build_v30_three_plan_apk.py
          grep -Fq 'scoring-evidence.js' tools/v30/build_v30_three_plan_apk.py
          grep -Fq 'detail-evidence-enhancer.js' tools/v30/build_v30_three_plan_apk.py
          grep -Fq 'evidence-enhancer.css' tools/v30/build_v30_three_plan_apk.py
          grep -Fq 'ftr-logo-exact.sha256' tools/v30/build_v30_three_plan_apk.py
          grep -Fq 'ligament invisible ID map differs from physically verified v29.9' tools/v30/build_v30_three_plan_apk.py
          grep -Fq 'expected_changed = {HOST_INDEX, LIGAMENT_FRONT}' tools/v30/build_v30_three_plan_apk.py
          grep -Fq 'OUT-OF-SCOPE existing APK payload changed' tools/v30/build_v30_three_plan_apk.py
          grep -Fq 'PENDING_USER_RETEST' tools/v30/build_v30_three_plan_apk.py
          echo 'V30 BUILDER FAIL-CLOSED PASS'

      - name: Confirm no runtime WebGL regression
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'WebGLRenderer|GLTFLoader|OrbitControls|three/examples' tools/anatomy3d/src tools/clinical-scales
          echo 'NO WEBGL/GLB RUNTIME REGRESSION PASS'
