name: v30 exact logo materialize

on:
  push:
    branches:
      - v30-three-plan-premium

permissions:
  contents: write

jobs:
  materialize-exact-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: v30-three-plan-premium
          fetch-depth: 0

      - name: Reconstruct and verify exact Plan 3 logo
        shell: bash
        run: |
          set -euo pipefail
          OUT='tools/brand/ftr-logo-exact.png'
          SHA_FILE='tools/brand/ftr-logo-exact.sha256'
          META='tools/brand/ftr-logo-exact.metadata.json'
          EXPECTED_SHA='4168f34bfee9a8cfe240758561a3c94845206ada891da5b9730b6fc1e4702d75'
          EXPECTED_GIT_BLOB='4439b92096d04d6d90e277371826029ffb8091fd'

          test ! -e "$OUT"
          test ! -e "$SHA_FILE"
          test ! -e "$META"

          cat \
            tools/brand/.tmp-ftr-logo-exact.b64.part00 \
            tools/brand/.tmp-ftr-logo-exact.b64.part01 \
            tools/brand/.tmp-ftr-logo-exact.b64.part02 \
            tools/brand/.tmp-ftr-logo-exact.b64.part03 \
            tools/brand/.tmp-ftr-logo-exact.b64.part04 \
            tools/brand/.tmp-ftr-logo-exact.b64.part05 \
            tools/brand/.tmp-ftr-logo-exact.b64.part06 \
            tools/brand/.tmp-ftr-logo-exact.b64.part07 \
            tools/brand/.tmp-ftr-logo-exact.b64.part08 \
            tools/brand/.tmp-ftr-logo-exact.b64.part09 \
            tools/brand/.tmp-ftr-logo-exact.b64.part10 \
            > /tmp/ftr-logo-exact.b64

          test "$(wc -c < /tmp/ftr-logo-exact.b64 | tr -d ' ')" = '30900'
          base64 --decode /tmp/ftr-logo-exact.b64 > "$OUT"
          test "$(stat -c%s "$OUT")" = '23175'
          printf '%s  %s\n' "$EXPECTED_SHA" "$OUT" | sha256sum -c -
          test "$(git hash-object "$OUT")" = "$EXPECTED_GIT_BLOB"

          python3 - <<'PY'
          import struct
          p = 'tools/brand/ftr-logo-exact.png'
          with open(p, 'rb') as f:
              header = f.read(24)
          assert header[:8] == b'\x89PNG\r\n\x1a\n', 'PNG signature mismatch'
          width, height = struct.unpack('>II', header[16:24])
          assert (width, height) == (112, 112), (width, height)
          PY

          printf '%s' "$EXPECTED_SHA" > "$SHA_FILE"
          test "$(wc -c < "$SHA_FILE" | tr -d ' ')" = '64'

          cat > "$META" <<'JSON'
          {
            "status": "PIXEL_PRESERVING_CROP_CREATED_PHONE_VISUAL_QA_REQUIRED",
            "approved_source_filename": "ChatGPT Image 3 Eyl 2026 13_01_16.png",
            "approved_source_library_file_id": "file_000000000bb881f6b8e5378761e1e4aa",
            "approved_source_sha256": "5ed581158210e861af0ce93c0bc804372398b595765388ed6842d79784407792",
            "approved_source_dimensions": "1536x1024",
            "crop": {
              "x": 137,
              "y": 468,
              "width": 112,
              "height": 112
            },
            "output_filename": "ftr-logo-exact.png",
            "output_sha256": "4168f34bfee9a8cfe240758561a3c94845206ada891da5b9730b6fc1e4702d75",
            "output_git_blob_sha1": "4439b92096d04d6d90e277371826029ffb8091fd",
            "operations": [
              "rectangular_crop_only",
              "lossless_png_save"
            ],
            "forbidden_operations_confirmed_absent": [
              "resize",
              "recolor",
              "filter",
              "sharpen",
              "trace",
              "AI_regeneration",
              "upscale"
            ],
            "physical_phone_visual_qa": "PENDING",
            "final_locked": false
          }
          JSON

          python3 -m json.tool "$META" >/dev/null

      - name: Commit exact artifact and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm \
            tools/brand/.tmp-ftr-logo-exact.b64.part00 \
            tools/brand/.tmp-ftr-logo-exact.b64.part01 \
            tools/brand/.tmp-ftr-logo-exact.b64.part02 \
            tools/brand/.tmp-ftr-logo-exact.b64.part03 \
            tools/brand/.tmp-ftr-logo-exact.b64.part04 \
            tools/brand/.tmp-ftr-logo-exact.b64.part05 \
            tools/brand/.tmp-ftr-logo-exact.b64.part06 \
            tools/brand/.tmp-ftr-logo-exact.b64.part07 \
            tools/brand/.tmp-ftr-logo-exact.b64.part08 \
            tools/brand/.tmp-ftr-logo-exact.b64.part09 \
            tools/brand/.tmp-ftr-logo-exact.b64.part10 \
            .github/workflows/v30-exact-logo-materialize.yml

          git add \
            tools/brand/ftr-logo-exact.png \
            tools/brand/ftr-logo-exact.sha256 \
            tools/brand/ftr-logo-exact.metadata.json

          test "$(git hash-object tools/brand/ftr-logo-exact.png)" = '4439b92096d04d6d90e277371826029ffb8091fd'
          test "$(sha256sum tools/brand/ftr-logo-exact.png | cut -d' ' -f1)" = '4168f34bfee9a8cfe240758561a3c94845206ada891da5b9730b6fc1e4702d75'
          git diff --cached --check
          git commit -m 'Add exact Plan 3 brand binary and hash lock'
          git push origin HEAD:v30-three-plan-premium
