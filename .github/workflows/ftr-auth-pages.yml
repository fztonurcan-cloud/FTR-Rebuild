name: Validate FTR Auth Source

on:
  push:
    branches: [main]
    paths:
      - 'auth/**'
      - '.github/workflows/ftr-auth-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate auth source
        shell: bash
        run: |
          set -euo pipefail
          test -f auth/index.html
          test -s auth/index.html
          echo "FTR auth source is present."
          echo "GitHub Pages deployment is intentionally disabled; production auth UI is hosted outside GitHub Pages."
