name: v29.9 premium static anatomy atlas

on:
  push:
    branches:
      - v29.9-3d-premium
    paths:
      - 'tools/anatomy3d/**'
      - '!tools/anatomy3d/scripts/assemble_v29_7_base.py'
      - '!tools/anatomy3d/scripts/build_v29_8_apk.py'
      - '.github/workflows/v29.8-anatomy3d.yml'

concurrency:
  group: v29.9-static-atlas-workbench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-anatomy-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout anatomy branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Blender and headless rendering stack
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            blender unzip curl python3-numpy python3-pil \
            libegl1 libgl1 libglx0 libopengl0 libgles2 \
            libx11-6 libxext6 libxi6 libxrender1 libxrandr2 libxfixes3 \
            mesa-utils xvfb
          ldconfig -p | grep -E 'libEGL\.so\.1|libGL\.so\.1' || true
          blender --version | head -n 2

      - name: Download libre Z-Anatomy source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/z-anatomy
          curl -L --retry 3 --fail \
            -o /tmp/Z-Anatomy.zip \
            https://raw.githubusercontent.com/Z-Anatomy/Models-of-human-anatomy/master/Z-Anatomy.zip
          unzip -q /tmp/Z-Anatomy.zip -d /tmp/z-anatomy
          BLEND="$(find /tmp/z-anatomy -type f -name Startup.blend | head -n 1)"
          test -n "$BLEND"
          echo "BLEND_FILE=$BLEND" >> "$GITHUB_ENV"
          mkdir -p tools/anatomy3d/public/licenses
          curl -L --retry 3 --fail \
            -o tools/anatomy3d/public/licenses/Z-Anatomy-License.txt \
            https://raw.githubusercontent.com/Z-Anatomy/Models-of-human-anatomy/master/License.txt
          ls -lh /tmp/Z-Anatomy.zip "$BLEND"

      - name: Render five static layered anatomy atlases
        env:
          FTR_ANATOMY_OUT: ${{ github.workspace }}/tools/anatomy3d/public
          FTR_ATLAS_WIDTH: '720'
          FTR_ATLAS_HEIGHT: '1120'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          python3 -m py_compile tools/anatomy3d/scripts/render_static_atlas.py
          xvfb-run -a -s '-screen 0 1280x1024x24' \
            blender -b "$BLEND_FILE" \
            --python "$GITHUB_WORKSPACE/tools/anatomy3d/scripts/render_static_atlas.py"

      - name: Compose locked reference structures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/anatomy3d/scripts/postprocess_reference_groups.py
          python3 tools/anatomy3d/scripts/postprocess_reference_groups.py

      - name: Validate static atlas contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('tools/anatomy3d/public')
          data = json.loads((root/'data/atlas-map.json').read_text(encoding='utf-8'))
          assert data['render_mode'] == 'static-layered-atlas'
          assert data['policy']['webgl'] is False
          assert data['policy']['runtime_3d_models'] is False
          assert data['policy']['continuous_render_loop'] is False
          assert data['policy']['biceps_brachii_whole_muscle_selection'] is True
          required = ['muscle','bone','ligament','vessel','nerve']
          for key in required:
              row = data['systems'][key]
              assert row['structure_count'] > 0, (key, row['structure_count'])
              for asset in [row['beauty'], row['id_map']]:
                  p = root / asset
                  assert p.is_file() and p.stat().st_size > 1000, (key, asset)
              print(key, row['structure_count'], row['beauty'], row['id_map'])
          biceps = [r for r in data['systems']['muscle']['structures'] if r['name'].strip().lower() == 'biceps brachii']
          assert len(biceps) == 2, biceps
          assert {r['raw'] for r in biceps} == {'Biceps brachii.r', 'Biceps brachii.l'}, biceps
          assert all(r.get('object_type') == 'COMPOSITE' and len(r.get('members', [])) == 2 for r in biceps), biceps
          print('Biceps composite PASS', [(r['raw'], r['rgb'], r['anchor']) for r in biceps])
          PY
          ls -lh tools/anatomy3d/public/atlas/*.png

      - name: Install and bundle offline module
        working-directory: tools/anatomy3d
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build

      - name: Static package QA
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/anatomy3d/dist/index.html
          test -f tools/anatomy3d/dist/data/atlas-map.json
          for s in muscle bone ligament vessel nerve; do
            test -f "tools/anatomy3d/dist/atlas/${s}-front.png"
            test -f "tools/anatomy3d/dist/atlas/${s}-id.png"
          done
          test -f tools/anatomy3d/dist/licenses/ATTRIBUTION.txt
          test -f tools/anatomy3d/dist/licenses/Z-Anatomy-License.txt
          grep -R "3D ANATOM" tools/anatomy3d/dist/index.html tools/anatomy3d/dist/assets >/dev/null
          grep -R "Biceps brachii" tools/anatomy3d/dist/assets >/dev/null
          grep -R '"name": "Biceps brachii"' tools/anatomy3d/dist/data/atlas-map.json >/dev/null
          grep -R "Fibula" tools/anatomy3d/dist/assets >/dev/null
          grep -R "Anterior talofibular" tools/anatomy3d/dist/assets >/dev/null
          grep -R "Anterior tibial artery" tools/anatomy3d/dist/assets >/dev/null
          grep -R "Median sinir" tools/anatomy3d/dist/assets >/dev/null
          grep -R "static-layered-atlas" tools/anatomy3d/dist/assets >/dev/null
          ! grep -R -E "OrbitControls|GLTFLoader|WebGLRenderer|three/examples" tools/anatomy3d/dist/assets
          ! grep -E "Sınav Modu|Karma Sınav|Öğrenme Modu|Etiketler|Not Ekle|Bilgiyi Paylaş|Otomatik Döndür" tools/anatomy3d/dist/index.html
          du -sh tools/anatomy3d/dist

      - name: Create immutable module manifest
        shell: bash
        run: |
          set -euo pipefail
          cd tools/anatomy3d
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('dist')
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  rows.append({
                      'path':str(p.relative_to(root)).replace('\\','/'),
                      'bytes':p.stat().st_size,
                      'sha256':hashlib.sha256(p.read_bytes()).hexdigest()
                  })
          out={
              'module':'FTR Akademi 3D Anatomi',
              'version':'v29.9-static-atlas',
              'design_lock':'approved premium references 2026-09-02',
              'render_mode':'static-layered-atlas',
              'systems':['muscle','bone','ligament','vessel','nerve'],
              'runtime_webgl':False,
              'runtime_glb':False,
              'files':rows
          }
          pathlib.Path('ANATOMY3D-MANIFEST.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8')
          PY

      - name: Render phone QA screenshot
        shell: bash
        run: |
          set -euo pipefail
          cd tools/anatomy3d/dist
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ftr-anatomy-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          CHROME_BIN="$CHROME" node "$GITHUB_WORKSPACE/tools/anatomy3d/scripts/qa-browser.mjs" \
            http://127.0.0.1:4173/ "$GITHUB_WORKSPACE/tools/anatomy3d" screenshot

      - name: Assert locked 390x844 layout
        shell: bash
        run: |
          set -euo pipefail
          cd tools/anatomy3d/dist
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/ftr-anatomy-qa-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          CHROME_BIN="$CHROME" node "$GITHUB_WORKSPACE/tools/anatomy3d/scripts/qa-browser.mjs" \
            http://127.0.0.1:4174/ "$GITHUB_WORKSPACE/tools/anatomy3d" assert

      - name: Assert Reder-class 360x800 layout
        shell: bash
        run: |
          set -euo pipefail
          cd tools/anatomy3d/dist
          python3 -m http.server 4176 --bind 127.0.0.1 >/tmp/ftr-anatomy-qa-360-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          QA_WIDTH=360 QA_HEIGHT=800 CHROME_BIN="$CHROME" node "$GITHUB_WORKSPACE/tools/anatomy3d/scripts/qa-browser.mjs" \
            http://127.0.0.1:4176/ "$GITHUB_WORKSPACE/tools/anatomy3d/qa-360" assert

      - name: Verify five-system static atlas functions
        shell: bash
        run: |
          set -euo pipefail
          cd tools/anatomy3d/dist
          python3 -m http.server 4175 --bind 127.0.0.1 >/tmp/ftr-anatomy-function-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          CHROME_BIN="$CHROME" node "$GITHUB_WORKSPACE/tools/anatomy3d/scripts/qa-browser.mjs" \
            http://127.0.0.1:4175/ "$GITHUB_WORKSPACE/tools/anatomy3d" function

      - name: Upload premium static anatomy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v29.9-anatomy-static-atlas
          path: |
            tools/anatomy3d/dist
            tools/anatomy3d/integration
            tools/anatomy3d/DESIGN-LOCK.md
            tools/anatomy3d/ANATOMY3D-MANIFEST.json
            tools/anatomy3d/qa-phone.png
            tools/anatomy3d/qa-layout-report.json
            tools/anatomy3d/qa-layout-dom.html
            tools/anatomy3d/qa-function-report.json
            tools/anatomy3d/qa-function.png
            tools/anatomy3d/qa-360
          if-no-files-found: warn
          retention-days: 7
