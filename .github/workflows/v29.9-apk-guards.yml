name: v29.9 fail-closed APK guards

on:
  push:
    branches:
      - v29.9-3d-premium
    paths:
      - 'tools/anatomy3d/scripts/assemble_v29_7_base.py'
      - 'tools/anatomy3d/scripts/build_v29_8_apk.py'
      - '.github/workflows/v29.9-apk-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-apk-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout v29.9 anatomy branch
        uses: actions/checkout@v4

      - name: Compile APK guard scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/anatomy3d/scripts/assemble_v29_7_base.py \
            tools/anatomy3d/scripts/build_v29_8_apk.py
          python3 tools/anatomy3d/scripts/assemble_v29_7_base.py --help >/dev/null
          python3 tools/anatomy3d/scripts/build_v29_8_apk.py --help >/dev/null

      - name: Assert immutable v29.7 contract and builder agreement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import pathlib

          root = pathlib.Path('tools/anatomy3d/scripts')

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              assert spec and spec.loader
              spec.loader.exec_module(module)
              return module

          assembler = load('v297_assembler', root / 'assemble_v29_7_base.py')
          builder = load('v299_builder', root / 'build_v29_8_apk.py')

          assembler.validate_contract()
          assert assembler.BASE_NAME == 'FTR-Akademi-v29.7-BILDIRIM.apk'
          assert assembler.BASE_SIZE == 1_133_611_894
          assert assembler.BASE_SHA256 == 'f541b238e40113c02de101a9b7059f6b192f8381eaffbd0357314ce25bdd715c'
          assert len(assembler.PARTS) == 5
          assert sum(row[1] for row in assembler.PARTS) == assembler.BASE_SIZE
          assert builder.BASE_NAME == assembler.BASE_NAME
          assert builder.BASE_SIZE == assembler.BASE_SIZE
          assert builder.BASE_SHA256 == assembler.BASE_SHA256
          assert builder.EXPECTED_CERT_SHA256 == '8771cb32093de52d180d08270909fa5796850900bf7eecaf2b3181873c488be2'
          assert builder.HOST_INDEX == 'assets/app/index.html'
          assert builder.MODULE_PREFIX == 'assets/app/anatomy3d/'
          print('v29.7 immutable contract + v29.9 builder agreement PASS')
          PY

      - name: Assert assembler fails closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import pathlib
          import tempfile

          script = pathlib.Path('tools/anatomy3d/scripts/assemble_v29_7_base.py')
          spec = importlib.util.spec_from_file_location('v297_assembler', script)
          assembler = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(assembler)

          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              parts = root / 'parts'
              parts.mkdir()

              # Missing locked parts must abort without creating an output.
              missing_output = root / 'missing.apk'
              try:
                  assembler.assemble(parts, missing_output)
              except SystemExit:
                  pass
              else:
                  raise AssertionError('missing parts did not fail closed')
              assert not missing_output.exists()

              # Existing output must never be overwritten, even before part reads.
              protected_output = root / 'protected.apk'
              protected_output.write_bytes(b'DO-NOT-OVERWRITE')
              before = protected_output.read_bytes()
              try:
                  assembler.assemble(parts, protected_output)
              except SystemExit:
                  pass
              else:
                  raise AssertionError('existing output did not fail closed')
              assert protected_output.read_bytes() == before

              # Simulate the race where an output appears only after a verified
              # temporary file exists. Promotion must still refuse to clobber it.
              verified_temp = root / 'verified.tmp'
              verified_temp.write_bytes(b'VERIFIED-TEMP')
              raced_output = root / 'raced.apk'
              raced_output.write_bytes(b'EXISTING-RACE-WINNER')
              raced_before = raced_output.read_bytes()
              try:
                  assembler.promote_no_clobber(verified_temp, raced_output)
              except SystemExit:
                  pass
              else:
                  raise AssertionError('atomic promotion race did not fail closed')
              assert raced_output.read_bytes() == raced_before
              assert verified_temp.read_bytes() == b'VERIFIED-TEMP'

          print('assembler missing-part + overwrite + race no-clobber guards PASS')
          PY

      - name: Assert signer and bootstrap parsers fail closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import pathlib
          import types

          script = pathlib.Path('tools/anatomy3d/scripts/build_v29_8_apk.py')
          spec = importlib.util.spec_from_file_location('v299_builder', script)
          builder = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(builder)

          good = '''
          Verified using v1 scheme (JAR signing): true
          Verified using v2 scheme (APK Signature Scheme v2): true
          Verified using v3 scheme (APK Signature Scheme v3): false
          Number of signers: 1
          V2 Signer: certificate SHA-256 digest: 8771cb32093de52d180d08270909fa5796850900bf7eecaf2b3181873c488be2
          '''

          def set_apksigner_output(text):
              def fake_run(*args, **kwargs):
                  return types.SimpleNamespace(stdout=text)
              builder.run = fake_run

          set_apksigner_output(good)
          verified = builder.verify_signing(pathlib.Path('/fake/apksigner'), pathlib.Path('/fake/app.apk'))
          assert verified['v1'] is True
          assert verified['v2'] is True
          assert verified['signer_count'] == 1
          assert verified['certificate_sha256'] == builder.EXPECTED_CERT_SHA256

          def must_fail(text, label):
              set_apksigner_output(text)
              try:
                  builder.verify_signing(pathlib.Path('/fake/apksigner'), pathlib.Path('/fake/app.apk'))
              except SystemExit:
                  return
              raise AssertionError(f'{label} did not fail closed')

          must_fail(good.replace('v1 scheme (JAR signing): true', 'v1 scheme (JAR signing): false'), 'v1=false')
          must_fail(good.replace('Number of signers: 1', 'Number of signers: 2'), 'multiple signers')
          must_fail(
              good.replace(builder.EXPECTED_CERT_SHA256, '0' * 64),
              'wrong signer certificate',
          )

          html = '<!doctype html><html><head></head><body></body></html>'
          host_once = builder.inject_host_bootstrap(html)
          assert host_once.count('data-ftr-anatomy3d') == 2
          assert 'anatomy3d-home-card.css' in host_once
          assert 'anatomy3d-home-inject.js' in host_once
          try:
              builder.inject_host_bootstrap(host_once)
          except SystemExit:
              pass
          else:
              raise AssertionError('duplicate host bootstrap did not fail closed')

          module_once = builder.inject_module_bootstrap(html)
          assert 'android-asset-fetch.js' in module_once
          assert 'module-phone-fix.css' in module_once
          module_twice = builder.inject_module_bootstrap(module_once)
          assert module_twice == module_once

          print('apksigner + bootstrap parser fail-closed behavior PASS')
          PY

      - name: Print locked v29.7 contract for audit log
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/anatomy3d/scripts/assemble_v29_7_base.py --print-contract
