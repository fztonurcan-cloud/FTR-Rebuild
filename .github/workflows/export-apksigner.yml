name: Export Android APK Signer
on:
  push:
    branches: [ftr-v41-offline-localization]
    paths: ['.github/workflows/export-apksigner.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;36.0.0'
          mkdir -p /tmp/apksigner-kit
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" /tmp/apksigner-kit/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" /tmp/apksigner-kit/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" /tmp/apksigner-kit/
      - uses: actions/upload-artifact@v4
        with:
          name: apksigner-kit-36
          path: /tmp/apksigner-kit/
          retention-days: 1
