name: FTR Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'phase_04/ftr_app/lib/**'
      - 'phase_04/ftr_app/test/**'
      - 'phase_04/ftr_app/android/**'
      - 'phase_04/ftr_app/tools/**'
      - 'phase_04/ftr_app/supabase/functions/legal-pages/**'
      - 'phase_04/ftr_app/pubspec.yaml'
      - 'phase_04/ftr_app/pubspec.lock'
      - 'phase_04/ftr_app/analysis_options.yaml'
      - '.github/workflows/ftr-android-debug.yml'

permissions:
  contents: read

concurrency:
  group: ftr-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Public client configuration. Authorization is enforced by Supabase RLS
      # and the dedicated internal preview tester allow-list.
      SUPABASE_URL: https://dkawrwinmyjvkzioruki.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_fQrP8FQtglit057xrYngtQ_M_ZoZQEl
      FTR_DEBUG_INTERNAL_REVIEW_PREVIEW: YES

    defaults:
      run:
        working-directory: phase_04/ftr_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter doctor -v

      - name: Android identity regression gate
        run: python3 tools/test_android_release_gate.py

      - name: Build verified debug APK
        env:
          PLAY_MONTHLY_PRODUCT_ID: ${{ secrets.PLAY_MONTHLY_PRODUCT_ID }}
          PLAY_YEARLY_PRODUCT_ID: ${{ secrets.PLAY_YEARLY_PRODUCT_ID }}
        run: bash ./tools/build_android_debug.sh

      - name: Upload APK + checksum
        uses: actions/upload-artifact@v4
        with:
          name: FTR-debug-4.0.0-25
          path: |
            phase_04/ftr_app/dist/FTR-debug-4.0.0-25.apk
            phase_04/ftr_app/dist/FTR-debug-4.0.0-25.apk.sha256
            phase_04/ftr_app/dist/pubspec.lock
            phase_04/ftr_app/dist/pubspec.lock.sha256
          if-no-files-found: error
          retention-days: 14
