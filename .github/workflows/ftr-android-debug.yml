name: FTR Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'phase_04/ftr_app/**'
      - '.github/workflows/ftr-android-debug.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: phase_04/ftr_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter doctor -v

      - name: Android identity regression gate
        run: python3 tools/test_android_release_gate.py

      - name: Build verified debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          PLAY_MONTHLY_PRODUCT_ID: ${{ secrets.PLAY_MONTHLY_PRODUCT_ID }}
          PLAY_YEARLY_PRODUCT_ID: ${{ secrets.PLAY_YEARLY_PRODUCT_ID }}
        run: ./tools/build_android_debug.sh

      - name: Upload APK + checksum
        uses: actions/upload-artifact@v4
        with:
          name: FTR-debug-4.0.0-25
          path: |
            phase_04/ftr_app/dist/FTR-debug-4.0.0-25.apk
            phase_04/ftr_app/dist/FTR-debug-4.0.0-25.apk.sha256
            phase_04/ftr_app/dist/pubspec.lock
            phase_04/ftr_app/dist/pubspec.lock.sha256
          if-no-files-found: error
          retention-days: 14
