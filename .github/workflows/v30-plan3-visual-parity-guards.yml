name: v30 Plan 3 visual parity fail-closed guards

on:
  push:
    branches: [v30-three-plan-premium]
    paths:
      - 'tools/v30/apply_v30_plan3_visual_parity.py'
      - 'tools/brand/ftr-logo-exact.png'
      - 'tools/brand/ftr-logo-exact.sha256'
      - 'THREE-PLAN-SCOPE-LOCK.md'
      - '.github/workflows/v30-plan3-visual-parity-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan3-visual-parity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile packager
        run: python -m py_compile tools/v30/apply_v30_plan3_visual_parity.py

      - name: Verify exact canonical brand lock
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/brand/ftr-logo-exact.png
          test -f tools/brand/ftr-logo-exact.sha256
          expected="$(tr -d '\r\n ' < tools/brand/ftr-logo-exact.sha256)"
          test "$expected" = "4168f34bfee9a8cfe240758561a3c94845206ada891da5b9730b6fc1e4702d75"
          actual="$(sha256sum tools/brand/ftr-logo-exact.png | awk '{print $1}')"
          test "$actual" = "$expected"
          test "$(stat -c %s tools/brand/ftr-logo-exact.png)" = "23175"

      - name: Verify Plan 3 parity scope and exact target set
        shell: python
        run: |
          from pathlib import Path
          p = Path('tools/v30/apply_v30_plan3_visual_parity.py').read_text(encoding='utf-8')
          lock = Path('THREE-PLAN-SCOPE-LOCK.md').read_text(encoding='utf-8')
          required = [
              'assets/app/app_logo.png',
              'assets/app/v30-three-plan.css',
              'assets/app/v30-three-plan.js',
              'res/Cx.png','res/Wn.png','res/Ko.png',
              'assets/app/brand/ftr-logo-exact.png',
              'assets/app/anatomy3d/atlas/muscle-front.png',
              '__FTR_V30_PREMIUM_WELCOME__',
              '>BAŞLA<',
              'OUT-OF-SCOPE final payload change',
              'all_non_allowed_core_payload_byte_crc_unchanged',
              'lessons_quizzes_movement_content_notes_favorites_auth_notifications_ftr_ai_untouched',
          ]
          missing = [x for x in required if x not in p]
          if missing:
              raise SystemExit(f'Plan 3 visual parity contract missing: {missing}')
          for token in ['Launcher visual parity is part of Plan 3','Startup visual parity is part of Plan 3','**BAŞLA**']:
              if token not in lock:
                  raise SystemExit(f'Scope lock missing: {token}')
          forbidden_runtime_targets = [
              'assets/app/app.js',
              'assets/app/movement/studio.js',
              'assets/app/auth',
              'assets/app/clinical-scales/data.js',
              'assets/app/anatomy3d/data/atlas-map.json',
          ]
          # The patcher may mention protected areas in documentation/QA text, but
          # it must never use them as zip-removal/write targets.
          write_section = p[p.index("removals ="):p.index("run(['zip','-q','-d'")]
          for target in forbidden_runtime_targets:
              if target in write_section:
                  raise SystemExit(f'Forbidden protected target in patch set: {target}')
          print('PLAN3_VISUAL_PARITY_GUARD_PASS')
